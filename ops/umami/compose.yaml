services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in private .env}
      POSTGRES_DB: umami
    volumes:
      - umami-postgres:/var/lib/postgresql/data
    networks: [analytics]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?set in private .env}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?set in private .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?set in private .env}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:3000:3000"
    networks: [analytics]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12

networks:
  analytics:
    external: true
    name: kidfocus-analytics

volumes:
  umami-postgres:
